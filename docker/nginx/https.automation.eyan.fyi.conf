# HTTPS production config for automation.eyan.fyi (EYAN Automation Hub / n8n).
#
# Installed only after scripts/install.sh has confirmed a valid certificate
# exists at /etc/letsencrypt/live/automation.eyan.fyi/ (STEP 4). Independent
# of, and never edits, /etc/nginx/sites-available/eyan.fyi or code.eyan.fyi
# — every vhost on this host shares nothing but the host's port 80/443.
#
# Managed by scripts/install.sh — edit this template, then re-run
# install.sh, rather than hand-editing the deployed copy.

server {
    listen 80;
    listen [::]:80;
    server_name automation.eyan.fyi;

    # Keep serving ACME challenges over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx on this host is 1.24.0, which predates the `http2 on;` directive
    # (added in 1.25.1) — http2 is enabled via the older `listen ... http2`
    # form instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name automation.eyan.fyi;

    ssl_certificate     /etc/letsencrypt/live/automation.eyan.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automation.eyan.fyi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # n8n enforces its own owner/login auth on every request; nginx adds
    # transport security and headers on top of that, not instead of it.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # n8n webhook nodes can receive file uploads; keep this generous but
    # bounded rather than unlimited.
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;

        # Required for n8n's editor push connection (websocket) — the
        # editor UI is unusable without this (live execution status,
        # collaborative editing).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Workflow executions triggered synchronously through a webhook can
        # legitimately run for minutes; n8n's own default execution timeout
        # is higher than nginx's 60s default, so nginx would otherwise
        # return a 504 while the workflow keeps running server-side.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
