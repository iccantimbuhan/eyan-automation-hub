# HTTP-only bootstrap for automation.eyan.fyi.
#
# Purpose: serve the ACME HTTP-01 challenge so certbot (webroot plugin) can
# issue the certificate, WITHOUT referencing any certificate files — those
# don't exist yet at this point in the install. Installing an HTTPS block
# before the cert exists is what breaks `nginx -t` on first bootstrap; this
# file exists specifically to avoid that.
#
# Replaced by https.automation.eyan.fyi.conf once a valid certificate is
# issued (see scripts/install.sh STEP 5). Independent of, and never edits,
# /etc/nginx/sites-available/eyan.fyi or code.eyan.fyi.
#
# Managed by scripts/install.sh — edit this template, then re-run
# install.sh, rather than hand-editing the deployed copy.

server {
    listen 80;
    listen [::]:80;
    server_name automation.eyan.fyi;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "automation.eyan.fyi is being provisioned. Try again shortly.\n";
    }
}
